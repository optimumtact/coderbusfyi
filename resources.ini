[Core references]
DM Reference = https://ref.dm-lang.org/ | Unofficial DM reference that is easy to use.
DM Playground = https://play.dm-lang.org/ | Web based DM compiler and editor.
DM Build mirror = https://byond-builds.dm-lang.org/ | Mirror of the official BYOND build packages.
DM Reference (Official) = https://www.byond.com/docs/ref/#/DM | Official reference (not as easy to use)

[Learning paths]
SS13 Hosting Guide = https://www.youtube.com/playlist?list=PL6o5Pj2jK5oR32IIISSjMx_fJ-X5gYE2Y | Playlist of videos about hosting Space Station 13 Servers.
Wine Byond Help = https://github.com/kinggoldcatter/Wine-Byond-help | Tips and tricks for getting byond running in linux
Ter13's Snippet Sundays = https://www.byond.com/forum/post/2215739 | Snippets from a BYOND wizard (not SS13 focused)
DM by example = https://spacestation13.github.io/DMByExample/introduction.html | Step by step guide to DM in the style of rust by example.
Byond Performance Bible = https://docs.google.com/document/d/1lHBY6kfzFHA-eKqwJh6RuEjeHWBGTowYomcGKvODgqk/edit?usp=sharing | A document detailing advanced BYOND performance quirks.
SS13 codebase origin graph = https://github.com/spacestation13/SS13-Codebases | A graph of the origin point of each SS13 Fork
TGUI Storybook = https://tgstation.github.io/tgui-core | Storybook of TGUI elements (UI used by many codebases)

[Toolbox]
DM Language Server = https://marketplace.visualstudio.com/items?itemName=platymuus.dm-langclient | Visual Studio Code extension that provides DM language support.
RSC Explorer = https://affectedarc07.co.uk/rscexplorer/ | Tool for exploring RSC files.
StrongDMM = https://github.com/SpaiR/StrongDMM | Robust Map Editor for BYOND
Guide To Mapping = https://hackmd.io/@tgstation/SyVma0dS5 | Learn How To Work With BYOND Maps
Voidworks = https://github.com/voidcrew/Voidworks | Fork of StrongDMM with additional features
OpenDream for VS Code = https://github.com/OpenDreamProject/vscode-opendream | VS Code extension that provides an OpenDream installer, task runner, and DM debugger.
DMI Editor for Aseprite = https://github.com/spacestation13/aseprite-dmi | Aseprite extension providing DMI editing support

[Infrastructure]
Map Diff Bot = https://github.com/apps/mapdiffbot-2 | Github App that shows map changes in github PRs.
Icon Diff Bot = https://github.com/apps/icondiffbot-2 | Github App that shows icon changes in github PRs.
TGS = https://github.com/tgstation/tgstation-server | Hosting tool that manages DreamDaemon instances and integrates github repos.
Rust-g library = https://github.com/tgstation/rust-g | Support Library for Rust based utility functions for the engine
meowtonin = https://github.com/absolucy/meowtonin | Ergonomic Rust wrapper for BYOND external library API
DM Test Suite = https://github.com/spacestation13/dm-test-suite | Regression tests for the dreammaker language for new BYOND releases
