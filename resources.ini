[Core references]
DM Reference = https://ref.dm-lang.org/ | Unofficial DM reference that is easy to use.
DM Playground = https://play.dm-lang.org/ | Web based DM compiler and editor.
DM Build mirror = https://byond-builds.dm-lang.org/ | Mirror of the official BYOND build packages.

[Learning paths]
SS13 Hosting Guide = https://www.youtube.com/playlist?list=PL6o5Pj2jK5oR32IIISSjMx_fJ-X5gYE2Y | Play list of videos about hosting Space Station 13 Servers.

[Toolbox]
DM Language Server = https://marketplace.visualstudio.com/items?itemName=platymuus.dm-langclient | Visual Studio Code extension that provides DM language support.
Map Diff Bot = https://github.com/apps/mapdiffbot-2 | Github App that shows map changes in github PRs.
Icon Diff Bot = https://github.com/apps/icondiffbot-2 | Github App that shows icon changes in github PRs.
RSC Explorer = https://affectedarc07.co.uk/rscexplorer/ | Tool for exploring RSC files.
TGS = https://github.com/tgstation/tgstation-server | Hosting tool that manages DreamDaemon instances and integrates github repos.
