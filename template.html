<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Coderbus resources"
    />
    <title>Coder // Bus</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark">[ Coder // Bus ]</span>
          <span class="brand-subtitle">Tools and Links</span>
        </div>

        <div class="topbar-controls">
          <button class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
            <span class="theme-toggle__icon" aria-hidden="true">☾</span>
            <span class="theme-toggle__label">dark</span>
          </button>

          <div class="status-panel">
            <span class="status-led"></span>
            <span>online</span>
          </div>
        </div>
      </header>

      <main class="content">
        {{RESOURCE_SECTIONS}}
      </main>
    </div>

    <script>
      (function () {
        const root = document.documentElement;
        const button = document.querySelector('.theme-toggle');
        const icon = document.querySelector('.theme-toggle__icon');
        const label = document.querySelector('.theme-toggle__label');

        function applyTheme(theme) {
          root.setAttribute('data-theme', theme);
          const isLight = theme === 'light';
          button.setAttribute('aria-pressed', String(isLight));
          icon.textContent = isLight ? '☀' : '☾';
          label.textContent = isLight ? 'light' : 'dark';
        }

        const storedTheme = localStorage.getItem('coderbus-theme');
        const browserPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const initialTheme = storedTheme || (browserPrefersLight ? 'light' : 'dark');
        applyTheme(initialTheme);

        button.addEventListener('click', function () {
          const nextTheme = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
          localStorage.setItem('coderbus-theme', nextTheme);
          applyTheme(nextTheme);
        });

        const statusPanel = document.querySelector('.status-panel');
        if (statusPanel) {
          const minDelay = 10000;
          const maxDelay = 60000;
          const animationDurationMs = 5000;

          function triggerStatusParallax() {
            const now = new Date().toISOString();
            console.log('[parallax] trigger at', now);
            statusPanel.classList.remove('is-parallaxing');
            void statusPanel.offsetWidth;
            statusPanel.classList.add('is-parallaxing');

            setTimeout(function () {
              const finishTime = new Date().toISOString();
              console.log('[parallax] finish at', finishTime);
              statusPanel.classList.remove('is-parallaxing');
              scheduleStatusParallax();
            }, animationDurationMs);
          }

          function scheduleStatusParallax() {
            const delay = minDelay + Math.random() * (maxDelay - minDelay);
            const nextAt = new Date(Date.now() + delay).toISOString();
            console.log('[parallax] scheduled for', nextAt, 'delayMs=', delay.toFixed(0));
            setTimeout(triggerStatusParallax, delay);
          }

          scheduleStatusParallax();
        }
      })();
    </script>
  </body>
</html>
